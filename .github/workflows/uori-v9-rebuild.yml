name: UORI v9 Constitution Rebuild

on:
  push:
    branches:
      - rebuild/uori-v9-constitution
  pull_request:
    branches:
      - rebuild/uori-v9-constitution

jobs:
  vnext-manifest:
    name: Validate UORI v9 constitutional manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JSON documents
        run: |
          python3 -m json.tool vnext/manifest.json >/dev/null
          python3 -m json.tool vnext/manifest.schema.json >/dev/null
          python3 -m json.tool vnext/instructions/core.json >/dev/null
          python3 -m json.tool vnext/files/trace.json >/dev/null
      - name: Validate manifest and constitutional safety rules
        run: python3 vnext/tools/validate_manifest.py
      - name: Run deterministic tests
        run: |
          python3 -m unittest vnext.tests.test_vnext_manifest -v
          python3 vnext/tests/test_parser.py
          python3 vnext/tests/test_compile_print.py
          python3 vnext/tools/compile_print.py examples/hello.ar < examples/hello.ar > /tmp/uori_v9_hello_result.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/uori_v9_hello_result.json', encoding='utf-8'))
          assert result['result']['status'] == 'success'
          assert result['result']['inference_mode'] == 'deterministic'
          assert result['result']['error_bound'] <= 16
          assert result['result']['backend'] == 'reference-only'
          assert len(result['ast']) == 3
          print('VNEXT_HELLO_REFERENCE=PASS')
          PY
      - name: Reject whitespace errors
        run: git diff --check
