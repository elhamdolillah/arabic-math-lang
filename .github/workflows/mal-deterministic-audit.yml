name: MAL deterministic cross-environment audit

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  mal-cross-env-build:
    name: Deterministic audit (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ubuntu-22.04
            runner: ubuntu-22.04
          - label: ubuntu-24.04
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify interpreter
        run: python3 --version

      - name: Generate cross-environment manifest
        run: |
          mkdir -p evidence/cross-env
          python3 scripts/run_mal_cross_env_manifest.py \
            --label "${{ matrix.label }}" \
            --output "evidence/cross-env/${{ matrix.label }}.json" \
            | tee "evidence/cross-env/${{ matrix.label }}.stdout"

      - name: Verify local manifest and generated audit output
        run: |
          python3 -m json.tool "evidence/cross-env/${{ matrix.label }}.json" >/dev/null
          rm -rf extensions/__pycache__ tests/__pycache__
          git diff --exit-code -- . ':!evidence/MAL_CI_RUN.stdout' ':!evidence/MAL_CI_RUN.sha256' ':!evidence/cross-env/'

      - name: Hash manifest evidence
        run: |
          sha256sum "evidence/cross-env/${{ matrix.label }}.json" \
            "evidence/cross-env/${{ matrix.label }}.stdout" \
            > "evidence/cross-env/${{ matrix.label }}.sha256"

      - name: Upload environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cross-env-${{ matrix.label }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            evidence/cross-env/${{ matrix.label }}.json
            evidence/cross-env/${{ matrix.label }}.stdout
            evidence/cross-env/${{ matrix.label }}.sha256
            evidence/MAL_CI_RUN.stdout
            evidence/MAL_DIR_VALIDATOR_AUDIT_REPORT_AR.md
            evidence/MAL_DIR_VALIDATOR.stdout
            evidence/MAL_DIR_NODE_ANALYSIS.stdout
            evidence/MAL_POLICY_GATE_COMPARATOR_RUN1.stdout
            evidence/MAL_POLICY_GATE_COMPARATOR_REPRO.sha256
            protocol/MAL_DENY_POLICY_v0.1_AR.md
            evidence/MAL_DENY_POLICY_CI.stdout
            evidence/MAL_DENY_POLICY_CI.sha256
            evidence/MAL_GRAMMAR_GATE_COMPARATOR.stdout
            evidence/MAL_GRAMMAR_GATE_COMPARATOR_ARTIFACTS.sha256
            evidence/MAL_GRAMMAR_CORPUS_PARSER.stdout

  mal-cross-env-alpine:
    name: Deterministic audit (alpine-3.20-musl)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build pinned Alpine musl audit image
        run: docker build --pull --file ci/alpine-malus.Dockerfile --tag mal-alpine-malus:3.20 .

      - name: Run deterministic audit inside Alpine musl
        run: |
          mkdir -p evidence/cross-env
          docker run --rm \
            --network none \
            -e PYTHONHASHSEED=0 \
            -e SOURCE_DATE_EPOCH=0 \
            -e LC_ALL=C.UTF-8 \
            -e LANG=C.UTF-8 \
            -e MAL_SKIP_GIT_DIFF=1 \
            -e GITHUB_SHA="${{ github.event.pull_request.head.sha || github.sha }}" \
            --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            mal-alpine-malus:3.20 \
            sh -euxc 'python3 --version && \
              python3 scripts/run_mal_cross_env_manifest.py \
                --label alpine-3.20-musl \
                --output evidence/cross-env/alpine-3.20-musl.json \
                | tee evidence/cross-env/alpine-3.20-musl.stdout'

      - name: Verify Alpine manifest and generated audit output
        run: |
          python3 -m json.tool evidence/cross-env/alpine-3.20-musl.json >/dev/null
          rm -rf extensions/__pycache__ tests/__pycache__ research/__pycache__ frontend/__pycache__
          git diff --exit-code -- . ':!evidence/MAL_CI_RUN.stdout' ':!evidence/MAL_CI_RUN.sha256' ':!evidence/cross-env/'

      - name: Hash Alpine evidence
        run: |
          sha256sum evidence/cross-env/alpine-3.20-musl.json \
            evidence/cross-env/alpine-3.20-musl.stdout \
            > evidence/cross-env/alpine-3.20-musl.sha256

      - name: Upload Alpine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cross-env-alpine-3.20-musl-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            evidence/cross-env/alpine-3.20-musl.json
            evidence/cross-env/alpine-3.20-musl.stdout
            evidence/cross-env/alpine-3.20-musl.sha256
            evidence/MAL_CI_RUN.stdout
            evidence/MAL_DIR_VALIDATOR_AUDIT_REPORT_AR.md
            evidence/MAL_DIR_VALIDATOR.stdout
            evidence/MAL_DIR_NODE_ANALYSIS.stdout
            evidence/MAL_POLICY_GATE_COMPARATOR_RUN1.stdout
            evidence/MAL_POLICY_GATE_COMPARATOR_REPRO.sha256
            protocol/MAL_DENY_POLICY_v0.1_AR.md
            evidence/MAL_DENY_POLICY_CI.stdout
            evidence/MAL_DENY_POLICY_CI.sha256
            evidence/MAL_GRAMMAR_GATE_COMPARATOR.stdout
            evidence/MAL_GRAMMAR_GATE_COMPARATOR_ARTIFACTS.sha256
            evidence/MAL_GRAMMAR_CORPUS_PARSER.stdout

  mal-ownership-arena-rust:
    name: MAL Ownership Arena (Rust)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_NET_OFFLINE: "true"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -C debuginfo=0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Run pointer-free Arena tests
        run: |
          set -eux
          bash scripts/run_mal_ownership_arena_rust.sh | tee evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
          sha256sum evidence/MAL_OWNERSHIP_ARENA_RUST.stdout > evidence/MAL_OWNERSHIP_ARENA_RUST.sha256

      - name: Verify MAL language-lineage registry
        run: |
          set -eux
          python3 tests/test_language_lineage_registry.py | tee evidence/MAL_LANGUAGE_LINEAGE_REGISTRY.stdout
          sha256sum evidence/MAL_LANGUAGE_LINEAGE_REGISTRY.stdout > evidence/MAL_LANGUAGE_LINEAGE_REGISTRY.sha256

      - name: Verify MAL v0.2 extension registry
        run: |
          set -eux
          python3 tests/test_mal_extensions_v0_2.py | tee evidence/MAL_EXTENSIONS_V0_2.stdout
          sha256sum evidence/MAL_EXTENSIONS_V0_2.stdout > evidence/MAL_EXTENSIONS_V0_2.sha256

      - name: Verify Rust Arena evidence
        run: |
          grep -Fx 'MAL_OWNERSHIP_ARENA_RUST=PASS' evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
          grep -Fx 'RAW_POINTERS=FORBIDDEN' evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
          grep -Fx 'UNSAFE_CODE=FORBIDDEN' evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
          grep -Fx 'STATUS=0' evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
          grep -Fx 'MAL_EXTENSIONS_V0_2_REGISTRY=PASS' evidence/MAL_EXTENSIONS_V0_2.stdout
          grep -Fx 'RAW_POINTER_POLICY=DENY' evidence/MAL_EXTENSIONS_V0_2.stdout
          grep -Fx 'FLOAT_WITHOUT_CONTRACT=ABSTAIN' evidence/MAL_EXTENSIONS_V0_2.stdout
          grep -Fx 'STATUS=0' evidence/MAL_EXTENSIONS_V0_2.stdout

      - name: Verify GADT/rank research checker
        run: |
          set -eux
          python3 research/test_gadt_rank_checker.py | tee evidence/GADT_RANK_CHECKER.stdout
          sha256sum evidence/GADT_RANK_CHECKER.stdout > evidence/GADT_RANK_CHECKER.sha256
          grep -Fx 'GADT_RANK_CHECKER=PASS' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'GADT_BOUNDED_EXHAUSTIVE=RESEARCH' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'RANK2_EXPLICIT_FORALL=RESEARCH' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'REFLECTION=DENY' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'IMPREDICATIVE=DENY' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'AMBIGUITY=ABSTAIN' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'SOURCE_EXECUTION=NOT_PERFORMED' evidence/GADT_RANK_CHECKER.stdout
          grep -Fx 'STATUS=0' evidence/GADT_RANK_CHECKER.stdout

      - name: Verify attached mechanisms 31-39 registry
        run: |
          set -eux
          python3 tests/test_attached_mechanisms_31_39.py | tee evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
          sha256sum evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout > evidence/MAL_ATTACHED_MECHANISMS_31_39.sha256
          grep -Fx 'ATTACHED_MECHANISMS_CHECKER=PASS' evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
          grep -Fx 'RUNTIME_FEATURES_ADMITTED=0' evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
          grep -Fx 'BASELINE_MODIFIED=NO' evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
          grep -Fx 'SOURCE_EXECUTION=NOT_PERFORMED' evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
          grep -Fx 'STATUS=0' evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout

      - name: Verify governed MAL dual execution
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -eux
          python3 tests/test_mal_dual_execution.py | tee evidence/MAL_DUAL_EXECUTION_STATIC.stdout
          python3 scripts/mal_dual_execution.py | tee evidence/MAL_DUAL_EXECUTION.stdout
          sha256sum evidence/MAL_DUAL_EXECUTION_STATIC.stdout evidence/MAL_DUAL_EXECUTION.stdout > evidence/MAL_DUAL_EXECUTION.sha256
          grep -Fx 'MAL_DUAL_STATIC_CHECK=PASS' evidence/MAL_DUAL_EXECUTION_STATIC.stdout
          grep -Fx 'MAL_DUAL_EXECUTION=PASS' evidence/MAL_DUAL_EXECUTION.stdout
          grep -Fx 'SOURCE_EXECUTION=NOT_PERFORMED_UNTRUSTED_SOURCE' evidence/MAL_DUAL_EXECUTION.stdout
          grep -Fx 'NETWORK=DISABLED_BY_CONTRACT' evidence/MAL_DUAL_EXECUTION.stdout
          grep -Fx 'AUTO_PROMOTION=DENY' evidence/MAL_DUAL_EXECUTION.stdout
          grep -Fx 'STATUS=0' evidence/MAL_DUAL_EXECUTION.stdout

      - name: Upload Rust Arena evidence
        uses: actions/upload-artifact@v4
        with:
          name: mal-ownership-arena-rust-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: |
            evidence/MAL_OWNERSHIP_ARENA_RUST.stdout
            evidence/MAL_OWNERSHIP_ARENA_RUST.sha256
            rust/mal_ownership_arena/Cargo.toml
            rust/mal_ownership_arena/Cargo.lock
            rust/mal_ownership_arena/src/lib.rs
            scripts/run_mal_ownership_arena_rust.sh
            evidence/MAL_LANGUAGE_LINEAGE_REGISTRY.stdout
            evidence/MAL_LANGUAGE_LINEAGE_REGISTRY.sha256
            protocol/MAL_LANGUAGE_LINEAGE_INTEGRATION_AR.md
            protocol/MAL_LANGUAGE_LINEAGE_REGISTRY_AR.json
            tests/test_language_lineage_registry.py
            protocol/MAL_EXTENSIONS_V0_2_AR.md
            protocol/MAL_EXTENSIONS_V0_2_REGISTRY_AR.json
            tests/MAL_EXTENSIONS_V0_2_CORPUS_AR.json
            tests/test_mal_extensions_v0_2.py
            evidence/MAL_EXTENSIONS_V0_2.stdout
            evidence/MAL_EXTENSIONS_V0_2.sha256
            evidence/GADT_RANK_CHECKER.stdout
            evidence/GADT_RANK_CHECKER.sha256
            research/gadt_rank_checker.py
            research/test_gadt_rank_checker.py
            protocol/MAL_GADT_RANK_RESEARCH_AR.md
            protocol/MAL_GADT_RANK_RESEARCH_REGISTRY_AR.json
            tests/MAL_GADT_RANK_RESEARCH_CORPUS_AR.json
            tests/test_gadt_rank_research.py
            protocol/MAL_ATTACHED_MECHANISMS_REVIEW_31_39_AR.md
            protocol/MAL_ATTACHED_MECHANISMS_31_39_REGISTRY_AR.json
            tests/MAL_ATTACHED_MECHANISMS_31_39_CORPUS_AR.json
            tests/test_attached_mechanisms_31_39.py
            evidence/MAL_ATTACHED_MECHANISMS_31_39.stdout
            evidence/MAL_ATTACHED_MECHANISMS_31_39.sha256
            protocol/MAL_DUAL_EXECUTION_CONTRACT_AR.md
            tests/MAL_DUAL_EXECUTION_CORPUS_AR.json
            tests/test_mal_dual_execution.py
            scripts/mal_dual_execution.py
            evidence/MAL_DUAL_EXECUTION_STATIC.stdout
            evidence/MAL_DUAL_EXECUTION.stdout
            evidence/MAL_DUAL_EXECUTION.sha256

  # Resource policy: extra reporting runs only once daily or by explicit manual dispatch.
  mal-arabic-coverage-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: MAL Arabic coverage audit
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run deterministic coverage audit
        run: |
          set -eux
          mkdir -p evidence/mal-arabic-coverage
          python3 tests/test_mal_arabic_coverage_audit.py | tee evidence/mal-arabic-coverage/test.stdout
          python3 scripts/mal_arabic_coverage_audit.py --output evidence/mal-arabic-coverage/report.json | tee evidence/mal-arabic-coverage/audit.stdout
          python3 scripts/render_mal_coverage_summary.py evidence/mal-arabic-coverage/report.json evidence/mal-arabic-coverage/latest-summary.md | tee evidence/mal-arabic-coverage/summary.stdout
          sha256sum evidence/mal-arabic-coverage/report.json evidence/mal-arabic-coverage/audit.stdout evidence/mal-arabic-coverage/test.stdout evidence/mal-arabic-coverage/latest-summary.md > evidence/mal-arabic-coverage/SHA256SUMS
          cat evidence/mal-arabic-coverage/latest-summary.md >> "$GITHUB_STEP_SUMMARY"
          tar -czf evidence/mal-arabic-coverage.tar.gz -C evidence mal-arabic-coverage
          grep -Fx 'MAL_ARABIC_COVERAGE_TEST=PASS' evidence/mal-arabic-coverage/test.stdout
          grep -Fx 'BASELINE_MODIFIED=NO' evidence/mal-arabic-coverage/audit.stdout
          grep -Fx 'AUTO_MERGE=DENY' evidence/mal-arabic-coverage/audit.stdout
          grep -Fx 'STATUS=0' evidence/mal-arabic-coverage/audit.stdout
          git diff --exit-code -- . ':!evidence/mal-arabic-coverage/'
      - name: Upload Arabic coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-arabic-coverage-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: evidence/mal-arabic-coverage.tar.gz
          retention-days: 7

  # Resource policy: never run the continuation queue on every push or pull request.
  mal-automated-continuation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Resume governed MAL verification tasks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resume allowlisted verification tasks in isolation
        run: |
          set -eux
          rm -rf /tmp/mal-continuation
          mkdir -p /tmp/mal-continuation
          cp -a . /tmp/mal-continuation/source
          mkdir -p evidence/mal-continuation
          python3 scripts/monitor_mal_unified_corpus.py \
            --corpus tests/MAL_UNIFIED_GOVERNED_CORPUS_AR.json \
            --expected-sha256 dea668ca6cbddbb86348a5bbd5d21a84a8a952a0f4f171a548bebc7344e33b09 \
            | tee evidence/mal-continuation/unified-corpus-sha256.stdout
          sha256sum evidence/mal-continuation/unified-corpus-sha256.stdout > evidence/mal-continuation/unified-corpus-sha256.sha256
          grep -Fx 'CORPUS_PRESENT=YES' evidence/mal-continuation/unified-corpus-sha256.stdout
          grep -Fx 'CHECKSUM_MATCH=YES' evidence/mal-continuation/unified-corpus-sha256.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/unified-corpus-sha256.stdout
          python3 tests/test_mal_unified_corpus_monitor.py | tee evidence/mal-continuation/unified-corpus-monitor-test.stdout
          sha256sum evidence/mal-continuation/unified-corpus-monitor-test.stdout > evidence/mal-continuation/unified-corpus-monitor-test.sha256
          grep -Fx 'MAL_UNIFIED_CORPUS_MONITOR_TEST=PASS' evidence/mal-continuation/unified-corpus-monitor-test.stdout
          grep -Fx 'FAIL_CLOSED_MISMATCH=PASS' evidence/mal-continuation/unified-corpus-monitor-test.stdout
          grep -Fx 'FAIL_CLOSED_MISSING=PASS' evidence/mal-continuation/unified-corpus-monitor-test.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/unified-corpus-monitor-test.stdout
          python3 tests/test_attached_mechanisms_40_45.py | tee evidence/mal-continuation/mechanisms-40-45.stdout
          sha256sum evidence/mal-continuation/mechanisms-40-45.stdout > evidence/mal-continuation/mechanisms-40-45.sha256
          (cd /tmp/mal-continuation/source && python3 scripts/mal_automated_continuation.py) > evidence/mal-continuation/result.stdout
          sha256sum evidence/mal-continuation/result.stdout > evidence/mal-continuation/SHA256SUMS
          grep -Fx 'FORBIDDEN_PROMOTION=PASS' evidence/mal-continuation/mechanisms-40-45.stdout
          grep -Fx 'COUNTEREXAMPLES_PRESENT=PASS' evidence/mal-continuation/mechanisms-40-45.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/mechanisms-40-45.stdout
          grep -Fx 'SOURCE_EXECUTION=NOT_PERFORMED' evidence/mal-continuation/result.stdout
          grep -Fx 'NETWORK=DISABLED_BY_CONTRACT' evidence/mal-continuation/result.stdout
          grep -Fx 'AUTO_MERGE=DENY' evidence/mal-continuation/result.stdout
          grep -Fx 'BASELINE_MUTATED=NO' evidence/mal-continuation/result.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/result.stdout
          python3 tests/test_attached_mechanisms_46_50.py | tee evidence/mal-continuation/mechanisms-46-50.stdout
          sha256sum evidence/mal-continuation/mechanisms-46-50.stdout > evidence/mal-continuation/mechanisms-46-50.sha256
          python3 scripts/build_unified_mal_corpus.py | tee evidence/mal-continuation/unified-corpus-build.stdout
          sha256sum evidence/mal-continuation/unified-corpus-build.stdout > evidence/mal-continuation/unified-corpus-build.sha256
          python3 tests/test_mal_unified_corpus.py | tee evidence/mal-continuation/unified-corpus-check.stdout
          sha256sum evidence/mal-continuation/unified-corpus-check.stdout > evidence/mal-continuation/unified-corpus-check.sha256
          grep -Fx 'UNIFIED_CORPUS_CHECK=PASS' evidence/mal-continuation/unified-corpus-check.stdout
          grep -Fx 'MISSING_RANGES_EXPLICIT=PASS' evidence/mal-continuation/unified-corpus-check.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/unified-corpus-check.stdout
          grep -Fx 'ATTACHED_MECHANISMS_46_50_CHECK=PASS' evidence/mal-continuation/mechanisms-46-50.stdout
          grep -Fx 'RUNTIME_FEATURES_ADMITTED=0' evidence/mal-continuation/mechanisms-46-50.stdout
          grep -Fx 'COUNTEREXAMPLES_PRESENT=PASS' evidence/mal-continuation/mechanisms-46-50.stdout
          grep -Fx 'STATUS=0' evidence/mal-continuation/mechanisms-46-50.stdout
          cp tests/MAL_UNIFIED_GOVERNED_CORPUS_AR.json evidence/mal-continuation/
          rm -f tests/MAL_UNIFIED_GOVERNED_CORPUS_AR.json
          git diff --exit-code
          cp protocol/MAL_ATTACHED_MECHANISMS_REVIEW_40_45_AR.md evidence/mal-continuation/
          cp protocol/MAL_ATTACHED_MECHANISMS_40_45_REGISTRY_AR.json evidence/mal-continuation/
          cp protocol/MAL_ATTACHED_MECHANISMS_REVIEW_46_50_AR.md evidence/mal-continuation/
          cp protocol/MAL_ATTACHED_MECHANISMS_46_50_REGISTRY_AR.json evidence/mal-continuation/
          cp protocol/MAL_ATTACHED_MECHANISMS_78_80_REGISTRY_AR.json evidence/mal-continuation/
          cp tests/MAL_ATTACHED_MECHANISMS_78_80_CORPUS_AR.json evidence/mal-continuation/
          cp tests/test_mal_unified_corpus.py evidence/mal-continuation/
          cp tests/MAL_ATTACHED_MECHANISMS_40_45_CORPUS_AR.json evidence/mal-continuation/
          cp tests/MAL_ATTACHED_MECHANISMS_46_50_CORPUS_AR.json evidence/mal-continuation/
          cp tests/test_attached_mechanisms_46_50.py evidence/mal-continuation/
          cp scripts/monitor_mal_unified_corpus.py evidence/mal-continuation/
          cp tests/test_mal_unified_corpus_monitor.py evidence/mal-continuation/
      - name: Compress continuation evidence
        if: always()
        run: tar -czf evidence/mal-continuation.tar.gz -C evidence mal-continuation
      - name: Upload continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-continuation-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: evidence/mal-continuation.tar.gz

  mal-cross-env-compare:
    name: Compare cross-environment SHA-256 manifests
    needs: [mal-cross-env-build, mal-cross-env-alpine, mal-ownership-arena-rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      SOURCE_DATE_EPOCH: "0"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download Ubuntu 22.04 evidence
        uses: actions/download-artifact@v4
        with:
          name: mal-cross-env-ubuntu-22.04-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/cross-env/raw/ubuntu-22.04

      - name: Download Ubuntu 24.04 evidence
        uses: actions/download-artifact@v4
        with:
          name: mal-cross-env-ubuntu-24.04-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/cross-env/raw/ubuntu-24.04

      - name: Download Alpine musl evidence
        uses: actions/download-artifact@v4
        with:
          name: mal-cross-env-alpine-3.20-musl-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidence/cross-env/raw/alpine-3.20-musl

      - name: Materialize exactly one manifest per environment
        run: |
          set -eux
          mkdir -p evidence/cross-env
          find evidence/cross-env/raw/ubuntu-22.04 -type f -name 'ubuntu-22.04.json' -exec cp {} evidence/cross-env/ubuntu-22.04.json \;
          find evidence/cross-env/raw/ubuntu-24.04 -type f -name 'ubuntu-24.04.json' -exec cp {} evidence/cross-env/ubuntu-24.04.json \;
          find evidence/cross-env/raw/alpine-3.20-musl -type f -name 'alpine-3.20-musl.json' -exec cp {} evidence/cross-env/alpine-3.20-musl.json \;
          test -s evidence/cross-env/ubuntu-22.04.json
          test -s evidence/cross-env/ubuntu-24.04.json
          test -s evidence/cross-env/alpine-3.20-musl.json

      - name: Compare canonical digests
        run: |
          python3 scripts/compare_mal_cross_env_manifests.py \
            --input-dir evidence/cross-env \
            --output evidence/cross-env/comparison.json \
            | tee evidence/cross-env/comparison.stdout

      - name: Hash comparison evidence
        run: |
          sha256sum evidence/cross-env/comparison.json \
            evidence/cross-env/comparison.stdout \
            > evidence/cross-env/comparison.sha256

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mal-cross-env-comparison-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: evidence/cross-env/

      - name: Enforce comparison success
        run: grep -Fx 'CROSS_ENV_COMPARE=PASS' evidence/cross-env/comparison.stdout

      - name: Render Pull Request report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          python3 scripts/render_mal_pr_report.py \
            --comparison evidence/cross-env/comparison.json \
            --output evidence/cross-env/pr-report.md

      - name: Publish or update Pull Request comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/publish_mal_pr_report.sh evidence/cross-env/pr-report.md

      - name: Upload Pull Request report
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: mal-pr-report-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          path: evidence/cross-env/pr-report.md
