name: C40 Q64.64 Verification

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  c40-q64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Assembly toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm binutils
      - name: Install formal verification toolchain
        run: sudo apt-get update && sudo apt-get install -y coq
      - name: Build checked Coq Q64 model
        run: coqc -q -Q formal UORI formal/C40_Q64_Model.v
      - name: Build checked Q64 error bounds
        run: coqc -q -Q formal UORI formal/C40_Q64_Error_Bounds.v
      - name: Build checked Q32 shared core
        run: coqc -q -Q formal UORI formal/Q32_Core.v
      - name: Build checked Q32 complex model
        run: coqc -q -Q formal UORI formal/Q32_Complex.v
      - name: Build checked Q32 hypot semantic link
        run: coqc -q -Q formal UORI formal/Q32_Hypot_Semantic_Link.v
      - name: Build checked Q32 sqrt bounds
        run: coqc -q -Q formal UORI formal/C40_Q32_Sqrt_Bounds.v
      - name: Build checked Q32 hypot bounds
        run: coqc -q -Q formal UORI formal/C40_Q32_Hypot_Bounds.v
      - name: Build checked Q32 pow bounds
        run: coqc -q -Q formal UORI formal/C40_Q32_Pow_Bounds.v
      - name: Build checked Q32 pow semantic-link draft
        run: coqc -q -Q formal UORI formal/C40_Q32_Pow_Semantic_Link.v
      - name: Build checked Q32 pow instruction semantics
        run: coqc -q -Q formal UORI formal/C40_Q32_Pow_Instruction_Semantics.v
      - name: Build checked Q32 pow closed arithmetic
        run: coqc -q -Q formal UORI formal/C40_Q32_Pow_Closed_Arithmetic.v
      - name: Build checked Q32 sqrt semantic-link draft
        run: coqc -q -Q formal UORI formal/C40_Q32_Sqrt_Semantic_Link.v
      - name: Build checked Q32 sqrt Newton-link contract
        run: coqc -q -Q formal UORI formal/C40_Q32_Sqrt_Newton_Link.v
      - name: Python syntax check
        run: python3 -m py_compile math_complete.py src/wasm_backend.py
      - name: Validate UORI evidence result contract
        run: python3 tests/test_uori_result_contract.py
      - name: Generate UORI watar result contract
        run: python3 tools/generate_result_contract.py specs/functions/watar.json > /tmp/watar_result_contract.json
      - name: Validate UORI function specification
        run: python3 -c 'import json; x=json.load(open("/tmp/watar_result_contract.json", encoding="utf-8")); assert x["الدالة"] == "وتر@1"; assert x["التقريب"]["حد_الخطأ"] == 16; assert "تشخيص آلي" in x["الاستخدام_الممنوع"]'
      - name: Validate UORI function catalog
        run: python3 tests/test_uori_function_catalog.py
      - name: Validate all builtin readiness states
        run: python3 tests/test_uori_builtin_readiness.py
      - name: Build independent C oracle
        run: cc -std=c11 -O2 tests/c40_q32_verification/ref_exp_q64.c -lm -o /tmp/ref_exp_q64
      - name: Run Q64.64 boundary oracle
        run: /tmp/ref_exp_q64
      - name: Run Q32.32 C40 stress gate
        run: python3 tests/c40_q32_verification/test_c40_q32_stress.py
      - name: Run Q32.32 sqrt gate
        run: python3 tests/c40_q32_verification/test_sqrt_q32.py
      - name: Run Q32.32 hypot gate
        run: python3 tests/c40_q32_verification/test_hypot_q32.py
      - name: Run Q32.32 complex arithmetic gate
        run: python3 tests/c40_q32_verification/test_q32_complex.py
      - name: Run Q32.32 pow gate
        run: python3 tests/c40_q32_verification/test_quwa_q32.py
      - name: Run Q32.32 pow semantic-link structural gate
        run: python3 tests/c40_q32_verification/test_pow_semantic_link.py
      - name: Run Q32.32 pow signed-assembly model gate
        run: python3 tests/c40_q32_verification/test_pow_assembly_model.py
      - name: Run Q32.32 pow x86_64 runtime gate
        run: python3 tests/c40_q32_verification/test_pow_x86_runtime.py
      - name: Run Q32.32 pow instruction-semantics gate
        run: python3 tests/c40_q32_verification/test_pow_shift_semantics.py
      - name: Run Q32.32 sqrt semantic-model gate
        run: python3 tests/c40_q32_verification/test_sqrt_semantic_link.py
      - name: Run Q32.32 sqrt Newton-transition model gate
        run: python3 tests/c40_q32_verification/test_sqrt_newton_model.py
